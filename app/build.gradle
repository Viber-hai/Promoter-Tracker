plugins {
    id 'com.android.application'
}

def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def appVersionCode = ciRunNumber ? ciRunNumber.toInteger() : 1

android {
    namespace 'com.promoter.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.promoter.tracker"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName "1.0.${appVersionCode}"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            def keystorePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS")
            def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")

            if (keystorePath && keystorePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.9.1"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
