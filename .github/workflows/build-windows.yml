name: Build Windows installer
on:
  push:
    branches: [main, windows-desktop-installer]
    paths:
      - "app/src/main/assets/**"
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows app
        run: dotnet publish windows/PromoterTracker.Desktop/PromoterTracker.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows/publish
      - name: Download WebView2 Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/tools | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "windows/tools/MicrosoftEdgeWebView2Setup.exe"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "windows/installer/PromoterTracker.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PromoterTracker-Windows-Installer
          path: windows/dist/PromoterTracker-Setup.exe
          if-no-files-found: error